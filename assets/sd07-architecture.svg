<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Ticket booking architecture at a glance"><defs><pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b301"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5b301"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4b2"/></marker><marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a595dc"/></marker></defs><rect width="1280" height="640" fill="#07090f"/><rect width="1280" height="640" fill="url(#p)"/><g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<text x="40" y="46" fill="#00e5b0" font-size="16" font-weight="700" letter-spacing="5">ARCHITECTURE AT A GLANCE</text>
<rect x="30" y="64" width="1220" height="300" rx="18" fill="none" stroke="#f5b301" stroke-opacity=".35" stroke-dasharray="8 7"/><text x="50" y="92" fill="#f5b301" font-size="14" letter-spacing="3">WRITES · BUY (AMBER) — ONE CAREFUL PATH</text>
<rect x="30" y="392" width="500" height="216" rx="18" fill="none" stroke="#d8dde6" stroke-opacity=".25" stroke-dasharray="8 7"/><text x="50" y="420" fill="#9aa4b2" font-size="14" letter-spacing="3">READS · BROWSE (WHITE)</text>
<g><rect x="50" y="150" width="150" height="90" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="125.0" y="192.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Fan</text><text x="125.0" y="214.0" text-anchor="middle" fill="#9aa4b2" font-size="14">phone</text></g>
<g><rect x="250" y="150" width="170" height="90" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="335.0" y="192.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Waiting Room</text><text x="335.0" y="214.0" text-anchor="middle" fill="#9aa4b2" font-size="14">admits ~2,000/s</text></g>
<g><rect x="470" y="150" width="170" height="90" rx="14" fill="#12151d" stroke="#6aa9ff" stroke-width="2.5"/><text x="555.0" y="192.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">API Gateway</text><text x="555.0" y="214.0" text-anchor="middle" fill="#9aa4b2" font-size="14">pass · auth · route</text></g>
<g><rect x="690" y="150" width="180" height="90" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="780.0" y="192.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Seat Service</text><text x="780.0" y="214.0" text-anchor="middle" fill="#9aa4b2" font-size="14">hold · confirm · release</text></g>
<g><rect x="690" y="272" width="180" height="70" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="780.0" y="304.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Payment</text><text x="780.0" y="326.0" text-anchor="middle" fill="#9aa4b2" font-size="14">one key, one charge</text></g>
<g><rect x="940" y="104" width="160" height="76" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="1020.0" y="139.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Hold Store</text><text x="1020.0" y="161.0" text-anchor="middle" fill="#9aa4b2" font-size="14">Redis · SET NX EX</text></g>
<g><rect x="940" y="216" width="160" height="76" rx="14" fill="#12151d" stroke="#a595dc" stroke-width="2.5"/><text x="1020.0" y="251.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Booking DB</text><text x="1020.0" y="273.0" text-anchor="middle" fill="#9aa4b2" font-size="14">UNIQUE guard</text></g>
<g><rect x="1130" y="216" width="100" height="76" rx="14" fill="#12151d" stroke="#a595dc" stroke-width="2.5"/><text x="1180.0" y="251.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Queue</text><text x="1180.0" y="273.0" text-anchor="middle" fill="#9aa4b2" font-size="14">via outbox</text></g>
<g><rect x="1110" y="104" width="130" height="76" rx="14" fill="#12151d" stroke="#a595dc" stroke-width="2.5"/><text x="1175.0" y="139.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Notifier</text><text x="1175.0" y="161.0" text-anchor="middle" fill="#9aa4b2" font-size="14">email · SMS</text></g>
<path d="M200 195L248 195" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M420 195L468 195" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M640 195L688 195" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M870 170L938 142" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M870 225L938 250" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#a)"/>
<path d="M780 242L780 270" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#a)" marker-start="url(#as)"/>
<path d="M1100 254L1128 254" stroke="#a595dc" stroke-width="3" fill="none" marker-end="url(#p2)"/>
<path d="M1180 214L1180 182" stroke="#a595dc" stroke-width="3" fill="none" marker-end="url(#p2)"/>
<path d="M125 240L125 450" stroke="#d8dde6" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#w)"/><text x="138" y="330" fill="#9aa4b2" font-size="14">reads</text>
<g><rect x="60" y="452" width="200" height="84" rx="14" fill="#12151d" stroke="#d8dde6" stroke-width="2.5"/><text x="160.0" y="491.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Edge / CDN</text><text x="160.0" y="513.0" text-anchor="middle" fill="#9aa4b2" font-size="14">page + seat-map snapshot</text></g>
<g><rect x="320" y="452" width="190" height="84" rx="14" fill="#12151d" stroke="#d8dde6" stroke-width="2.5"/><text x="415.0" y="491.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Catalog</text><text x="415.0" y="513.0" text-anchor="middle" fill="#9aa4b2" font-size="14">events · venues</text></g>
<path d="M262 494L318 494" stroke="#d8dde6" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#w)"/>
<text x="440" y="132" fill="#6aa9ff" font-size="14">short-lived pass on every call</text>
<text x="900" y="322" fill="#f5b301" font-size="14">two guards: Redis claim, then DB UNIQUE</text>
<g transform="translate(600 440)"><text x="0" y="0" fill="#fff" font-size="18" font-weight="700">Why this shape works</text><text x="0" y="34" fill="#c3cad6" font-size="16">• Reads go to the edge: ~99% of traffic never reaches origin</text><text x="0" y="64" fill="#c3cad6" font-size="16">• The waiting room turns a flood into a steady stream</text><text x="0" y="94" fill="#c3cad6" font-size="16">• One atomic claim decides the winner in one place</text><text x="0" y="124" fill="#c3cad6" font-size="16">• The database can never record a second sale</text><text x="0" y="154" fill="#c3cad6" font-size="16">• Events leave via an outbox, so no ticket is ever lost</text></g>
</g></svg>