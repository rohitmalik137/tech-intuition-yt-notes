<g transform="translate(60 660)"><text x="0" y="0" fill="#fff" font-size="17" font-weight="700">Why this shape works</text><text x="0" y="24" fill="#c3cad6" font-size="14">• 150 orders/s is small: the hard parts are correctness, latency and coordination</text><text x="0" y="44" fill="#c3cad6" font-size="14">• One order = one store, so a busy store cannot slow another · The database decides stock, Redis only advises</text></g>
