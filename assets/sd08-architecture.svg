<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="URL shortener architecture at a glance"><defs><pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b301"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00e5b0"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a595dc"/></marker></defs><rect width="1280" height="640" fill="#07090f"/><rect width="1280" height="640" fill="url(#p)"/><g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<text x="40" y="46" fill="#00e5b0" font-size="16" font-weight="700" letter-spacing="5">ARCHITECTURE AT A GLANCE</text>
<rect x="30" y="64" width="1220" height="320" rx="18" fill="none" stroke="#f5b301" stroke-opacity=".35" stroke-dasharray="8 7"/><text x="50" y="92" fill="#f5b301" font-size="14" letter-spacing="3">HOT PATH · REDIRECT (AMBER) — about 99% of traffic</text>
<g><rect x="50" y="120" width="150" height="90" rx="14" fill="#12151d" stroke="#d8dde6" stroke-width="2.5"/><text x="125.0" y="162.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Browser</text><text x="125.0" y="184.0" text-anchor="middle" fill="#9aa4b2" font-size="14">GET /aB3xY9k</text></g>
<g><rect x="250" y="120" width="150" height="90" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="325.0" y="162.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Load Balancer</text><text x="325.0" y="184.0" text-anchor="middle" fill="#9aa4b2" font-size="14"></text></g>
<g><rect x="450" y="120" width="190" height="90" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="545.0" y="162.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">App Servers</text><text x="545.0" y="184.0" text-anchor="middle" fill="#9aa4b2" font-size="14">stateless · local cache</text></g>
<g><rect x="700" y="104" width="170" height="70" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="785.0" y="136.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Redis Cache</text><text x="785.0" y="158.0" text-anchor="middle" fill="#9aa4b2" font-size="14">cache-aside · LRU</text></g>
<g><rect x="700" y="200" width="170" height="70" rx="14" fill="#12151d" stroke="#f5b301" stroke-width="2.5"/><text x="785.0" y="232.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Bloom filter</text><text x="785.0" y="254.0" text-anchor="middle" fill="#9aa4b2" font-size="14">not a real code? stop</text></g>
<g><rect x="940" y="120" width="190" height="90" rx="14" fill="#12151d" stroke="#a595dc" stroke-width="2.5"/><text x="1035.0" y="162.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">URL Store</text><text x="1035.0" y="184.0" text-anchor="middle" fill="#9aa4b2" font-size="14">sharded by code</text></g>
<path d="M200 165L248 165" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<path d="M400 165L448 165" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<path d="M640 145L698 139" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<path d="M640 190L698 232" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<path d="M870 139L938 160" stroke="#f5b301" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<text x="866" y="226" fill="#f5b301" font-size="14">miss only</text>
<g><rect x="1010" y="288" width="200" height="64" rx="14" fill="#12151d" stroke="#a595dc" stroke-width="2.5"/><text x="1110.0" y="317.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Event stream</text><text x="1110.0" y="339.0" text-anchor="middle" fill="#9aa4b2" font-size="14">click events → analytics</text></g>
<path d="M545 212V320H1008" stroke="#a595dc" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#mp)"/>
<text x="590" y="312" fill="#a595dc" font-size="14">async click event (never awaited)</text>
<rect x="30" y="404" width="730" height="200" rx="18" fill="none" stroke="#00e5b0" stroke-opacity=".35" stroke-dasharray="8 7"/><text x="50" y="432" fill="#00e5b0" font-size="14" letter-spacing="3">COLD PATH · CREATE (TEAL) — about 40 per second</text>
<g><rect x="60" y="460" width="190" height="90" rx="14" fill="#12151d" stroke="#00e5b0" stroke-width="2.5"/><text x="155.0" y="502.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Create API</text><text x="155.0" y="524.0" text-anchor="middle" fill="#9aa4b2" font-size="14">validate · rate limit</text></g>
<g><rect x="310" y="460" width="200" height="90" rx="14" fill="#12151d" stroke="#00e5b0" stroke-width="2.5"/><text x="410.0" y="502.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">ID Allocator</text><text x="410.0" y="524.0" text-anchor="middle" fill="#9aa4b2" font-size="14">leases blocks of 1,000</text></g>
<g><rect x="560" y="460" width="170" height="90" rx="14" fill="#12151d" stroke="#00e5b0" stroke-width="2.5"/><text x="645.0" y="502.0" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Scramble</text><text x="645.0" y="524.0" text-anchor="middle" fill="#9aa4b2" font-size="14">then base-62</text></g>
<path d="M250 505L308 505" stroke="#00e5b0" stroke-width="3" fill="none" marker-end="url(#mt)"/>
<path d="M510 505L558 505" stroke="#00e5b0" stroke-width="3" fill="none" marker-end="url(#mt)"/>
<path d="M730 505L1230 505L1230 165L1132 165" stroke="#00e5b0" stroke-width="3" fill="none" marker-end="url(#mt)"/>
<text x="780" y="495" fill="#00e5b0" font-size="14">INSERT, primary key guards uniqueness</text>
<g transform="translate(800 548)"><text x="0" y="0" fill="#fff" font-size="17" font-weight="700">Why this shape works</text><text x="0" y="24" fill="#c3cad6" font-size="14">• Data is tiny (3 TB); reads are huge</text><text x="0" y="46" fill="#c3cad6" font-size="14">• Cache absorbs almost every redirect</text><text x="0" y="68" fill="#c3cad6" font-size="14">• Id blocks: unique codes, no hot counter</text></g>
</g></svg>